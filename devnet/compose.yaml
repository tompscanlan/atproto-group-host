# The group host on a running atproto-devnet (OpenMeet-Team/snowglobe, the https stack).
# Start and stop it with devnet/host.sh, which sets the variables below.
#
# The host joins the devnet's network from outside its compose project, so the devnet's own
# down and up leave it attached (compose warns "Resource is still in use" and reuses the
# network). Its accounts, groups and blobs live on the volume grouphost-spike-data, which
# neither project's `down -v` removes.
name: ${HOST_PROJECT:-grouphost}

services:
  grouphost:
    # The pinned alpha PDS image, so @atproto/pds is exactly that build.
    image: ghcr.io/bluesky-social/atproto@sha256:f003adf7ca7cbb8ff60a4d99323fd009dfc1259b208f468f71accf0366ecab1e
    container_name: ${HOST_CONTAINER:-grouphost-spike}
    user: root
    restart: unless-stopped
    entrypoint: node
    command: /spike/host.mjs
    networks: [devnet]
    ports:
      # The devnet's nginx reaches the host here (host.docker.internal), at the port its
      # data/https/apps records for the route.
      - ${HOST_PORT:-7070}:7070
    # Throwaway keys: devnet only. The rotation key signs every group DID the host made, so
    # the file is kept between runs.
    env_file: ../spike/data/keys.env
    environment:
      PDS_PORT: 7070
      PDS_HOSTNAME: grouphost.devnet.internal
      PDS_SERVICE_HANDLE_DOMAINS: .gh.${SG_DOMAIN:?the devnet's domain, from its data/devnet.env}
      PDS_DATA_DIRECTORY: /data
      PDS_BLOBSTORE_DISK_LOCATION: /data/blocks
      PDS_DID_PLC_URL: http://plc:2582
      PDS_BSKY_APP_VIEW_URL: https://appview.invalid
      PDS_BSKY_APP_VIEW_DID: did:example:invalid
      PDS_REPORT_SERVICE_URL: https://moderator.invalid
      PDS_REPORT_SERVICE_DID: did:example:invalid
      PDS_CRAWLERS: ''
      PDS_DISABLE_SSRF_PROTECTION: 'true'
      PDS_INVITE_REQUIRED: 'false'
      PDS_LEXICON_AUTHORITY_DID: ${LEX_AUTHORITY_DID:?the devnet lexicon authority, from its data/devnet.env}
      PDS_DEV_MODE: 'false'
      LOG_ENABLED: 'true'
      LOG_LEVEL: info
      NODE_ENV: development
      HOST_PUBLIC_URL: https://grouphost.devnet.internal
      HOST_LOOPBACK_URL: http://127.0.0.1:7070
      HOST_PLC_URL: http://plc:2582
      NODE_EXTRA_CA_CERTS: /https/ca.crt
      NODE_OPTIONS: --require /spike/names.cjs
      SG_DOMAIN: ${SG_DOMAIN}
    volumes:
      - ${DEVNET:?the atproto-devnet checkout}/data/https/ca.crt:/https/ca.crt:ro
      - ../spike:/spike:ro
      - data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7070/xrpc/_health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  devnet:
    external: true
    name: ${SG_PROJECT:?the devnet's compose project}_atproto-devnet

volumes:
  data:
    external: true
    name: ${HOST_VOLUME:-grouphost-spike-data}
